name: Daily traffic statistics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-traffic-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Telegram snapshot validation and email rendering
        id: tests
        run: |
          node --test scripts/*.test.mjs
          python3 scripts/test-traffic-email.py
      - name: Fetch Cloudflare and Telegram statistics
        id: fetch
        env:
          TELEGRAM_STATS_BOT_TOKEN: ${{ secrets.TELEGRAM_STATS_BOT_TOKEN }}
          METADATA_STATS_BOT_TOKEN: ${{ secrets.METADATA_STATS_BOT_TOKEN }}
          METADATA_STATS_CHAT_ID: ${{ secrets.METADATA_STATS_CHAT_ID }}
          TELEGRAM_STATS_CHAT_ID: ${{ secrets.TELEGRAM_STATS_CHAT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHANNEL_STATS_SSH_HOST: ${{ secrets.CHANNEL_STATS_SSH_HOST }}
          CHANNEL_STATS_SSH_KEY: ${{ secrets.CHANNEL_STATS_SSH_KEY }}
          CHANNEL_STATS_KNOWN_HOSTS: ${{ secrets.CHANNEL_STATS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/channel-stats"
          printf '%s\n' "$CHANNEL_STATS_SSH_KEY" > "$RUNNER_TEMP/channel-stats/key"
          printf '%s\n' "$CHANNEL_STATS_KNOWN_HOSTS" > "$RUNNER_TEMP/channel-stats/known_hosts"
          chmod 600 "$RUNNER_TEMP/channel-stats/key" "$RUNNER_TEMP/channel-stats/known_hosts"
          export CHANNEL_STATS_SSH_KEY_PATH="$RUNNER_TEMP/channel-stats/key"
          export CHANNEL_STATS_KNOWN_HOSTS_PATH="$RUNNER_TEMP/channel-stats/known_hosts"
          node scripts/update-traffic-stats.mjs
      - name: Commit statistics
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analytics/traffic.json analytics/history/ README.md README.zh-CN.md
          if ! git diff --cached --quiet; then
            git commit -m "Update daily traffic statistics"
            git push
          fi
      - name: Email traffic report
        id: report_email
        env:
          MAIL_CONFIG: ${{ secrets.MAIL_CONFIG }}
        run: |
          if [ -z "$MAIL_CONFIG" ]; then
            echo "::notice::Daily email is not configured. Set the MAIL_CONFIG repository secret."
            exit 0
          fi
          python3 scripts/send-traffic-email.py
      - name: Email workflow failure notice
        if: failure()
        env:
          MAIL_CONFIG: ${{ secrets.MAIL_CONFIG }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          REPORT_EMAIL_OUTCOME: ${{ steps.report_email.outcome }}
        run: |
          if [ -z "$MAIL_CONFIG" ]; then
            echo "::notice::Failure email not sent because MAIL_CONFIG is not configured."
            exit 0
          fi
          if [ "$TESTS_OUTCOME" = failure ]; then
            export FAILED_STEP="Check Telegram snapshot validation and email rendering"
          elif [ "$FETCH_OUTCOME" = failure ]; then
            export FAILED_STEP="Fetch Cloudflare and Telegram statistics"
          elif [ "$COMMIT_OUTCOME" = failure ]; then
            export FAILED_STEP="Commit statistics"
          elif [ "$REPORT_EMAIL_OUTCOME" = failure ]; then
            export FAILED_STEP="Email traffic report"
          fi
          python3 scripts/send-traffic-email.py --failure
