name: Daily traffic statistics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-traffic-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Cloudflare traffic statistics
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/update-traffic-stats.mjs
      - name: Commit statistics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analytics/traffic.json analytics/history/ README.md README.zh-CN.md
          if ! git diff --cached --quiet; then
            git commit -m "Update daily traffic statistics"
            git push
          fi
      - name: Email traffic report
        env:
          MAIL_CONFIG: ${{ secrets.MAIL_CONFIG }}
        run: |
          if [ -z "$MAIL_CONFIG" ]; then
            echo "::notice::Daily email is not configured. Set the MAIL_CONFIG repository secret."
            exit 0
          fi
          python3 scripts/send-traffic-email.py
